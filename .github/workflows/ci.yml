name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Unit gate
        run: python -m pytest -q
      - name: CLI fake smoke
        run: |
          esprec agent-guide
          esprec snapshot --fake -o /tmp/esprec-face.png
          esprec record --fake -o /tmp/esprec-clip.gif
          test -s /tmp/esprec-face.png
          test -s /tmp/esprec-clip.gif

  # QEMU: optional until example firmware lands in-tree.
  # Metal remains confirmation for real panels.
  qemu-status:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - run: |
          echo "QEMU example firmware not yet in this job; unit gate is required."
          echo "See specs/ci.md — track tobozo/esp32-qemu-sim follow-up."
